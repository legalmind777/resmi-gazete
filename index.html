<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resmî Gazete Günlüğü</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#17223A; --muted:#566075; --line:#D3D9E2;
  --seal:#8A1C2C; --seal-soft:#F6E6E8; --seal-ink:#FFFFFF;
  --navy:#22345C; --navy-soft:#E3E9F4;
  --low:#8A93A5; --mark:#FFE8A3;
  --shadow:0 1px 2px rgba(23,34,58,.06), 0 8px 24px rgba(23,34,58,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#18202D; --sunk:#131A25; --ink:#E6EAF2; --muted:#9AA4B6; --line:#2C3647;
    --seal:#D9677A; --seal-soft:#3A1D25; --seal-ink:#1A0E12;
    --navy:#8FA8DA; --navy-soft:#1E2A42; --low:#6B7488; --mark:#5A4610;
    --shadow:none; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;margin:0;letter-spacing:-.01em}
a{color:var(--navy)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.shell{max-width:860px;margin:0 auto;padding:24px 18px 40px}
.head{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.seal{flex:none;width:58px;height:58px;border-radius:50%;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px color-mix(in srgb,var(--seal-ink) 55%,transparent)}
.seal svg{width:28px;height:28px}
.head h1{font-size:clamp(26px,4.5vw,34px);line-height:1.15}
.head p{margin:6px 0 0;color:var(--muted)}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tools{top:env(safe-area-inset-top,0px)}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;min-height:44px;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14px;user-select:none}
.toggle input{accent-color:var(--seal);width:16px;height:16px;margin:0}
.toggle:has(input:checked){border-color:var(--seal);background:var(--seal-soft)}

.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 20px 0;flex-wrap:wrap}
.day-head h2{font-size:22px}
.day-head .meta{font-size:13px;color:var(--muted)}
.day-head .meta a{color:var(--muted)}
.today-tag{display:inline-block;font:600 11.5px/1 "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--seal);border:1px solid var(--seal);border-radius:999px;padding:4px 8px;margin-bottom:8px}
.genel{margin:10px 20px 4px;padding:12px 14px;border-left:3px solid var(--seal);background:var(--sunk);border-radius:0 8px 8px 0;font-size:15px}
.items{list-style:none;margin:0;padding:8px 20px 16px}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .bolum{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.item h3{font-size:16.5px;line-height:1.35;display:flex;gap:9px;align-items:flex-start}
.item h3 a{color:inherit;text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:.45em}
.yuksek .dot{background:var(--seal)}
.orta .dot{background:var(--navy)}
.dusuk .dot{background:var(--low)}
.dusuk h3{font-weight:500;font-size:15px}
.item p{margin:5px 0 0 18px;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 18px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--navy-soft);color:var(--navy)}
.tag.yur{background:var(--seal-soft);color:var(--seal)}
.more{display:block;width:calc(100% - 40px);margin:0 20px 16px;min-height:40px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.more:hover{border-color:var(--navy);color:var(--navy)}

details.day > summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
details.day > summary::-webkit-details-marker{display:none}
details.day > summary .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
details.day > summary h2{font-size:18px}
details.day > summary .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
details.day > summary .g{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.day[open] > summary .g{display:none}
details.day[open] > summary{border-bottom:1px solid var(--line)}
details.day .genel{margin-top:14px}
.sec-title{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.maker{margin:30px auto 0;width:fit-content;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 26px;border:1px solid var(--line);border-top:3px solid var(--seal);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);text-align:center}
.maker-k{font-size:12.5px;color:var(--muted)}
.maker-v{font-family:"Source Serif 4",Georgia,serif;font-size:18px;font-weight:600}
.foot{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
@media (max-width:560px){.shell{padding:16px 12px 32px}.day-head,.items{padding-left:16px;padding-right:16px}.genel{margin-left:16px;margin-right:16px}.seal{width:48px;height:48px}.seal svg{width:24px;height:24px}}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="seal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 15h7M9 19h4"/></svg></div>
    <div>
      <h1>Resmî Gazete Günlüğü</h1>
      <p>Her sabah, günün Resmî Gazete’sinin hukukçular için kısa özeti.</p>
    </div>
  </header>

  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Arşivde ara: 5275, tebligat, avukatlık…" aria-label="Arşivde ara">
    </label>
    <label class="toggle"><input type="checkbox" id="onemli"> Yalnızca önemliler</label>
  </div>
  <div class="legend"><span><i style="background:var(--seal)"></i>Yüksek önem</span><span><i style="background:var(--navy)"></i>Orta</span><span><i style="background:var(--low)"></i>Düşük</span></div>

  <main id="list"><div class="empty">Yükleniyor…</div></main>

  <div class="maker"><span class="maker-k">Uygulama yapımcısı</span><span class="maker-v">Av. Melisa Çördük</span></div>
  <p class="foot">Özetler yapay zekâ tarafından otomatik hazırlanır ve hata içerebilir.<br>Hukuki işlemlerde daima Resmî Gazete’deki asıl metne başvurun.</p>
</div>

<script>
(() => {
'use strict';
const list = document.getElementById('list');
const qEl = document.getElementById('q'), onemliEl = document.getElementById('onemli');
let DAYS = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s ?? '').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i');
const longDate = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)).toLocaleDateString('tr-TR', {timeZone:'UTC', weekday:'long', day:'numeric', month:'long', year:'numeric'}); };
const RANK = {yuksek:0, orta:1, dusuk:2};

function hl(text, q) {
  const t = String(text ?? '');
  if (!q) return esc(t);
  const f = fold(t), qf = fold(q);
  let out = '', i = 0, j;
  if (f.length !== t.length) return esc(t);
  while ((j = f.indexOf(qf, i)) !== -1) { out += esc(t.slice(i, j)) + '<mark>' + esc(t.slice(j, j + qf.length)) + '</mark>'; i = j + qf.length; }
  return out + esc(t.slice(i));
}
const matches = (m, q) => !q || fold([m.baslik, m.ozet, m.bolum, (m.etiketler || []).join(' ')].join(' ')).includes(fold(q));

function itemHTML(m, q) {
  const tags = (m.etiketler || []).map(t => `<span class="tag">${hl(t, q)}</span>`).join('') + (m.yururluk ? `<span class="tag yur">Yürürlük: ${esc(m.yururluk)}</span>` : '');
  return `<li class="item ${esc(m.onem)}">${m.bolum ? `<div class="bolum">${esc(m.bolum)}</div>` : ''}<h3><span class="dot" aria-hidden="true"></span><a href="${esc(m.link)}" target="_blank" rel="noopener">${hl(m.baslik, q)}</a></h3>${m.ozet ? `<p>${hl(m.ozet, q)}</p>` : ''}${tags ? `<div class="tags">${tags}</div>` : ''}</li>`;
}

function dayBody(g, items, q, collapseLow) {
  const sorted = [...items].sort((a, b) => (RANK[a.onem] ?? 1) - (RANK[b.onem] ?? 1));
  const main = collapseLow ? sorted.filter(m => m.onem !== 'dusuk') : sorted;
  const low = collapseLow ? sorted.filter(m => m.onem === 'dusuk') : [];
  let h = g.genel ? `<div class="genel">${hl(g.genel, q)}</div>` : '';
  h += `<ul class="items">${main.map(m => itemHTML(m, q)).join('')}</ul>`;
  if (low.length) h += `<ul class="items low hidden-low" hidden>${low.map(m => itemHTML(m, q)).join('')}</ul><button class="more" type="button">Düşük önemli ${low.length} maddeyi göster</button>`;
  if (!items.length && !g.genel) h += '<div class="genel">Bu günde madde bulunamadı.</div>';
  return h;
}
const metaHTML = g => `${g.sayi ? `Sayı ${esc(g.sayi)} · ` : ''}<a href="${esc(g.link)}" target="_blank" rel="noopener">Resmî Gazete’de aç</a>${(g.mukerrer || []).length ? ` · ${g.mukerrer.length} mükerrer` : ''}`;

function render() {
  const q = qEl.value.trim(), onlyHigh = onemliEl.checked;
  if (!DAYS.length) { list.innerHTML = '<div class="empty">Arşiv henüz boş. İlk özet hazırlandığında burada görünecek.</div>'; return; }
  let html = '', shown = 0;
  DAYS.forEach((g, idx) => {
    let items = (g.maddeler || []).filter(m => matches(m, q));
    if (onlyHigh) items = items.filter(m => m.onem === 'yuksek');
    const genelHit = q && fold(g.genel).includes(fold(q));
    if ((q || onlyHigh) && !items.length && !(genelHit && !onlyHigh)) return;
    shown++;
    const first = idx === 0 && !q;
    if (first) {
      html += `<article class="day"><div class="day-head"><div><span class="today-tag">En son sayı</span><h2>${esc(longDate(g.tarih))}</h2></div><div class="meta">${metaHTML(g)}</div></div>${dayBody(g, items, q, !onlyHigh)}</article>`;
      if (DAYS.length > 1) html += '<h2 class="sec-title">Arşiv</h2>';
    } else {
      const n = items.length, hi = items.filter(m => m.onem === 'yuksek').length;
      html += `<details class="day"${q ? ' open' : ''}><summary><div class="row"><h2>${esc(longDate(g.tarih))}</h2><span class="cnt">${n} madde${hi ? ` · ${hi} önemli` : ''}</span></div>${g.genel ? `<div class="g">${esc(g.genel)}</div>` : ''}</summary><div class="day-head" style="padding-top:12px"><div class="meta">${metaHTML(g)}</div></div>${dayBody(g, items, q, !q && !onlyHigh)}</details>`;
    }
  });
  list.innerHTML = shown ? html : `<div class="empty">“${esc(q)}” için sonuç bulunamadı.</div>`;
}

list.addEventListener('click', e => {
  const b = e.target.closest('.more'); if (!b) return;
  const ul = b.previousElementSibling; ul.hidden = !ul.hidden;
  b.textContent = ul.hidden ? b.textContent.replace('gizle', 'göster') : b.textContent.replace('göster', 'gizle');
});
let t; qEl.addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 150); });
onemliEl.addEventListener('change', render);

fetch('data/arsiv.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : [])
  .then(d => { DAYS = Array.isArray(d) ? d : []; render(); })
  .catch(() => { DAYS = []; render(); });
})();
</script>
</body>
</html>
